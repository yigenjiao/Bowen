<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>失眠 · 灰盒</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<style>
:root{--ink:#f0e9dc;--muted:rgba(240,233,220,.6);--ember:#e6480f;--night:#070a12}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
.hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;letter-spacing:.04em}
.hud b{color:var(--ink);font-weight:500}
.bar{position:fixed;top:36px;left:14px;right:14px;height:2px;background:rgba(240,233,220,.12);pointer-events:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b4a7a,#f3c27a)}
.state{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);font-size:13px;padding:6px 14px;border-radius:999px;background:rgba(7,10,18,.6);border:1px solid rgba(240,233,220,.15);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.state.on{opacity:1}
.state.warn{border-color:rgba(160,190,255,.6);color:#cfe0ff}
.state.safe{border-color:rgba(127,176,105,.6);color:#bfe3a8}
.thought{position:fixed;pointer-events:none;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(120,150,255,.9);font-size:clamp(18px,4.5vw,30px);opacity:0;transition:opacity .25s,transform 1.4s ease-out;white-space:nowrap}
.pad{position:fixed;bottom:22px;width:84px;height:84px;border-radius:50%;background:rgba(240,233,220,.08);border:1px solid rgba(240,233,220,.2);display:grid;place-items:center;font-size:30px;color:var(--ink);touch-action:none}
.pad.on{background:rgba(240,233,220,.2)}
#padL{left:22px}#padR{left:122px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,14,.78);text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
#end{background:linear-gradient(180deg,rgba(5,7,14,0) 0%,rgba(5,7,14,.15) 40%,rgba(5,7,14,.6) 100%)}
#end .card{text-shadow:0 2px 18px rgba(0,0,0,.55)}
.card{max-width:420px}
.card .t{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.3em;color:var(--muted);margin-bottom:14px}
.card h1{font-size:34px;font-weight:700;letter-spacing:.08em;margin-bottom:14px}
.card p{color:var(--muted);line-height:1.9;font-size:14.5px}
.card .k{margin-top:14px;font-size:12px;color:rgba(240,233,220,.42);line-height:1.8}
.card button{margin-top:22px;font:inherit;font-size:15px;padding:12px 30px;border-radius:999px;border:0;background:var(--ember);color:#fff;cursor:pointer}
.flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 60%,rgba(170,195,255,.0),rgba(170,195,255,.45));opacity:0;pointer-events:none;transition:opacity .35s}
</style>
</head>
<body>
<div id="view"></div>
<div class="hud"><div><b>失眠</b> · 灰盒 v0.1</div><div>03:07 · 被念头抓住 <b id="caught">0</b> 次</div></div>
<div class="bar"><i id="prog"></i></div>
<div class="state" id="state"></div>
<div class="flash" id="flash"></div>
<div class="pad" id="padL">‹</div><div class="pad" id="padR">›</div>

<div class="overlay" id="intro"><div class="card">
  <div class="t">03:07 AM</div>
  <h1>失眠</h1>
  <p>你又醒了。房间大得不像话。<br>走到窗帘那边，等天亮。</p>
  <p class="k">← → 或屏幕左下角按钮移动<br>窗帘一亮，车灯就要扫过来了，躲到东西底下</p>
  <button id="go">开始</button>
</div></div>
<div class="overlay hide" id="end"><div class="card">
  <div class="t" id="endTime"></div>
  <h1>天亮了</h1>
  <p id="endText"></p>
  <button id="again">再来一次</button>
</div></div>

<script type="module">
import * as THREE from './vendor/three.module.min.js'; // 内置 three.js r169，不依赖 CDN
import { GLTFLoader } from './vendor/GLTFLoader.js';

/* ================= 关卡数据（单位：香蕉猫约 1 高） ================= */
const LEVEL = {
  start: 1, goal: 41.5, length: 44,
  // 躲藏点：x 范围内即视为躲好；mesh 由 buildRoom 生成
  hides: [
    { name: '床底下', x0: 5.5, x1: 16.5 },
    { name: '拖鞋里', x0: 20.6, x1: 22.4 },
    { name: '书后面', x0: 26.4, x1: 28.6 },
    { name: '衣服堆里', x0: 32.4, x1: 35.6 },
  ],
  thoughts: ['明天还要早起', '是不是白干了', '那句话是不是说错了', '还有三件事没做完', '再不睡就来不及了', '他们会怎么看我', '为什么还没睡着'],
};
const SPEED = 2.6;

/* ================= 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a12);
scene.fog = new THREE.Fog(0x070a12, 28, 70);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

const hemi = new THREE.HemisphereLight(0x4a5a8f, 0x120d0a, 1.6); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x7d8fd0, 1.1); // 窗外的冷月光
moon.position.set(46, 18, 10); moon.target.position.set(20, 0, -3); moon.castShadow = true;
moon.shadow.mapSize.set(1024, 512); Object.assign(moon.shadow.camera, { left: -30, right: 30, top: 16, bottom: -6, far: 80 });
scene.add(moon); scene.add(moon.target);
const night = new THREE.PointLight(0xffb36b, 3.5, 10, 0); // 床头小夜灯
night.position.set(2.2, 3.2, -1.5); scene.add(night); // 点光源阴影要渲染 6 次，手机上太贵，不开

const gray = (c = 0x5c6170, r = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };

function buildRoom() {
  // 地板与墙
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), gray(0x3a2f27, 0.8));
  floor.rotation.x = -Math.PI / 2; floor.position.set(22, 0, -4); floor.receiveShadow = true; scene.add(floor);
  box(80, 24, 0.5, gray(0x232a3d), 22, 12, -9);
  // 床（巨大）：床板离地 1.7，香蕉猫能从下面走过
  const bedM = gray(0x4a5168);
  box(12, 0.6, 7, bedM, 11, 2.0, -3.5);                       // 床板
  for (const [x, z] of [[5.2, -0.3], [16.8, -0.3], [5.2, -6.7], [16.8, -6.7]]) box(0.5, 1.7, 0.5, bedM, x, 0.85, z);
  box(12, 1.6, 7, gray(0x6b7390), 11, 3.1, -3.5);             // 床垫
  const blanket = gray(0x7d6fa0, 1);                            // 被子起伏
  for (let i = 0; i < 6; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(1.6 + (i % 2) * 0.6, 16, 12), blanket); s.scale.set(1.3, 0.55, 2.2); s.position.set(6.5 + i * 1.8, 4.1, -3.5); s.castShadow = true; scene.add(s); }
  box(0.6, 7, 7.4, bedM, 4.7, 3.5, -3.5);                      // 床头板
  // 床头柜 + 小夜灯
  LEVEL.nightstand = box(3, 3.2, 3, gray(0x51473d), 2, 1.6, -5.5);
  box(0.5, 0.9, 0.5, gray(0xf3c27a), 2.2, 3.65, -5.2);
  // 拖鞋（可躲）
  const slip = gray(0x8a6a8f);
  LEVEL.hides[1].props = [box(2.2, 0.35, 1.6, slip, 21.5, 1.3, 0), box(2.2, 1.3, 0.25, slip, 21.5, 0.65, -0.75)];
  // 书堆（可躲：书搭成一个洞）
  const bk = [0x6d4f3a, 0x3f5a6b, 0x7a3f3f, 0x55613f];
  LEVEL.hides[2].props = [box(0.5, 1.4, 1.8, gray(bk[0]), 26.6, 0.7, 0), box(0.5, 1.4, 1.8, gray(bk[1]), 28.4, 0.7, 0)];
  for (let i = 0; i < 4; i++) LEVEL.hides[2].props.push(box(2.6 - i * 0.15, 0.3, 2 - i * 0.1, gray(bk[i]), 27.5 + (i % 2) * 0.1, 1.55 + i * 0.3, 0));
  // 衣服堆（可躲）
  const cl = [0x5b6b8a, 0x8a5b5b, 0x6b6b6b];
  LEVEL.hides[3].props = [];
  for (let i = 0; i < 5; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(1.2, 14, 10), gray(cl[i % 3], 1)); s.scale.set(1.2, 0.85, 1); s.position.set(32.8 + i * 0.7, 1.15 + (i % 2) * 0.3, -0.1); s.castShadow = true; scene.add(s); LEVEL.hides[3].props.push(s); }
  // 杂物（不能躲，纯氛围）
  box(1.2, 0.08, 2.2, gray(0x111318), 24.5, 0.04, 0.6).material.emissive = new THREE.Color(0x1d2a55); // 掉在地上的手机
  LEVEL.dresser = box(3, 9, 2, gray(0x40475a), 30, 4.5, -7);     // 衣柜
  // 窗与窗帘（终点）
  box(0.4, 10, 6, gray(0x2b3248), 43.5, 7, -5);
  LEVEL.curtain = [box(1.2, 14, 1, gray(0x5a4f7a, 1), 42, 7, -1.5), box(1.2, 14, 1, gray(0x5a4f7a, 1), 42, 7, -6.5)];
  for (const c of LEVEL.curtain) c.material = c.material.clone();
  // 躲藏点道具做成可淡出
  for (const h of LEVEL.hides) for (const p of (h.props || [])) { p.material = p.material.clone(); p.material.transparent = true; }
}
buildRoom();

/* ================= 香蕉猫（占位） =================
 * 正式模型在 models/banana-cat.glb，加载成功后替换掉这个胶囊；加载失败才用它。 */
function makeCat() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.55, 6, 14), new THREE.MeshStandardMaterial({ color: 0xf2c94c, roughness: 0.6 }));
  body.position.y = 0.6; body.castShadow = true; g.add(body);
  const stem = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0x3a2a18 }));
  stem.position.set(0, 1.2, 0); g.add(stem);
  for (const s of [-1, 1]) { const ear = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.22, 8), new THREE.MeshStandardMaterial({ color: 0xf29bb5 })); ear.position.set(0.18 * s, 1.0, 0.05); ear.rotation.z = -0.35 * s; g.add(ear); }
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x111111 });
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), eyeM); e.position.set(0.11 * s, 0.72, 0.3); g.add(e); }
  g.userData.body = body;
  return g;
}
const cat = makeCat(); scene.add(cat);
cat.userData.baseY = 0.6;

/* ---- 正式模型：models/banana-cat.glb。加载失败就继续用占位胶囊 ---- */
// 骨骼动画参数。轴是骨骼自己的局部轴，按模型实测得出（three.js 会把骨骼名里的点去掉）
const V = (x, y, z) => new THREE.Vector3(x, y, z).normalize();
const POSE = {
  armDown: { axis: V(-1, 0, 0), angle: 1.15 },              // 两臂同轴：把 T 字形张开的手臂放下来
  armSwing: { axis: V(0, 0, 1), amp: 0.4 },                 // 左臂 +z 往后、右臂 +z 往前，同号即一前一后
  legL: V(1, 0, -1), legR: V(1, 0, 1), legAmp: 0.5,        // 大腿往前摆的轴（左右镜像）
  tail: { axis: V(0, 0, 1), amp: 0.35 },                    // 尾巴左右晃
  headDown: V(0, 0, -1),                                    // 低头
};
const rig = { bones: {}, rest: {} };
const _q = new THREE.Quaternion();
function poseBone(name, axis, angle, keep) { // keep=true 时在当前姿势上继续叠加
  const b = rig.bones[name]; if (!b) return;
  if (!keep) b.quaternion.copy(rig.rest[name]);
  b.quaternion.multiply(_q.setFromAxisAngle(axis, angle));
}
new GLTFLoader().loadAsync('models/banana-cat.glb').then(g => {
  const m = g.scene, box = new THREE.Box3().setFromObject(m), h = box.max.y - box.min.y;
  const wrap = new THREE.Group(); wrap.add(m);
  const k = 1.2 / (h || 1); m.scale.setScalar(k);
  m.position.set(-(box.min.x + box.max.x) / 2 * k, -box.min.y * k, -(box.min.z + box.max.z) / 2 * k);
  m.traverse(o => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    if (o.isBone) { rig.bones[o.name] = o; rig.rest[o.name] = o.quaternion.clone(); }
  });
  for (const c of [...cat.children]) if (!c.isLight) cat.remove(c);
  cat.add(wrap); cat.userData.body = wrap; cat.userData.baseY = 0; cat.userData.model = m;
  window.__rig = { rig, POSE, poseBone, THREE, cat };
}).catch(e => console.warn('香蕉猫模型加载失败，继续用占位胶囊', e));

/* ---- 本地测试模型：放在 models/local/（.gitignore 忽略，不进公开仓库）。找不到就继续用方块 ---- */
function loadProp(name, height, place, replace) {
  return new GLTFLoader().loadAsync('models/local/' + name + '.glb').then(g => {
    const m = g.scene, b = new THREE.Box3().setFromObject(m), size = b.getSize(new THREE.Vector3());
    const k = height / (size.y || 1); m.scale.multiplyScalar(k);
    const wrap = new THREE.Group(); wrap.add(m);
    m.position.set(-(b.min.x + b.max.x) / 2 * k, -b.min.y * k, -(b.min.z + b.max.z) / 2 * k); // 底面中心对齐原点
    m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
    place(wrap); scene.add(wrap);
    if (replace) replace.visible = false;
    return wrap;
  }).catch(() => null);
}
loadProp('cabinet', 6.5, w => { w.position.set(30, 0, -6.4); }, LEVEL.dresser);
loadProp('clock', 1.3, w => { w.position.set(1.2, 3.2, -5.0); w.rotation.y = 0.35; });
let hand = null; // 影子手：车灯扫过时从地板下伸出来，跟着光斑走
loadProp('shadow-hand', 2.4, w => { w.position.set(0, -3, -2.2); w.visible = false; w.traverse(o => { if (o.isMesh) o.material.color.setScalar(0.45); }); }).then(w => { hand = w; window.__hand = w; });

const catGlow = new THREE.PointLight(0xfff0c8, 1.2, 3.2, 0); catGlow.position.set(0, 1.4, 1.2); cat.add(catGlow); // 保证玩家看得见自己

/* ================= 车灯 ================= */
const beam = new THREE.SpotLight(0xcfe0ff, 0, 70, 0.3, 0.45, 0);
beam.castShadow = true; beam.shadow.mapSize.set(512, 512);
beam.position.set(44, 9, -3); scene.add(beam); scene.add(beam.target);
const coneGeo = new THREE.ConeGeometry(4.2, 14, 32, 1, true); coneGeo.translate(0, -7, 0); coneGeo.rotateX(-Math.PI / 2);
const cone = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({ color: 0xbfd4ff, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
scene.add(cone);
const spot = new THREE.Mesh(new THREE.CircleGeometry(2.8, 32), new THREE.MeshBasicMaterial({ color: 0xdfe9ff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
spot.rotation.x = -Math.PI / 2; spot.position.y = 0.02; scene.add(spot);
const BEAM_R = 2.6; // 地面上被照到的半径

/* ================= 状态 ================= */
const G = {
  phase: 'intro', x: LEVEL.start, dir: 1, input: 0, checkpoint: LEVEL.start, caught: 0, t: 0, hidden: false, hideName: '',
  beam: { mode: 'idle', timer: 3.5, x: 0 }, stun: 0,
};
window.__game = G;

function hideAt(x) { return LEVEL.hides.find(h => x >= h.x0 && x <= h.x1); }
function nextInterval() { return 2.0 + Math.random() * 1.2; }

/* ================= 输入 ================= */
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key); if (G.phase === 'intro' && (e.key === 'Enter' || e.key === ' ')) start(); });
addEventListener('keyup', e => keys.delete(e.key));
for (const [id, d] of [['padL', -1], ['padR', 1]]) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('on'); el.dataset.d = d; };
  const off = e => { e.preventDefault(); el.classList.remove('on'); delete el.dataset.d; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
function readInput() {
  let v = 0;
  if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) v -= 1;
  if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) v += 1;
  for (const id of ['padL', 'padR']) { const d = document.getElementById(id).dataset.d; if (d) v += +d; }
  return G.forceInput ?? Math.sign(v);
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
function setState(text, cls) { const s = $('state'); s.textContent = text; s.className = 'state' + (text ? ' on ' + (cls || '') : ''); }
function thought() {
  const el = document.createElement('div'); el.className = 'thought';
  el.textContent = LEVEL.thoughts[Math.floor(Math.random() * LEVEL.thoughts.length)];
  el.style.left = (20 + Math.random() * 45) + '%'; el.style.top = (22 + Math.random() * 30) + '%';
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = 1; el.style.transform = 'translateY(-26px) scale(1.06)'; });
  setTimeout(() => { el.style.opacity = 0; }, 1300); setTimeout(() => el.remove(), 1800);
}
function start() {
  Object.assign(G, { phase: 'play', x: LEVEL.start, checkpoint: LEVEL.start, caught: 0, t: 0, stun: 0, beam: { mode: 'idle', timer: 3.2, x: 0 } });
  $('caught').textContent = 0; $('intro').classList.add('hide'); $('end').classList.add('hide');
}
$('go').onclick = start; $('again').onclick = start;

/* ================= 循环 ================= */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 58 : 40; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let camX = LEVEL.start;
function step(dt) {
  if (G.phase === 'play') {
    G.t += dt;
    // 移动
    if (G.stun > 0) { G.stun -= dt; if (G.stun <= 0) { G.x = G.checkpoint; } }
    else {
      const v = readInput(); G.input = v;
      if (v) G.dir = v;
      G.x = Math.min(LEVEL.goal, Math.max(0.5, G.x + v * SPEED * dt));
    }
    const h = hideAt(G.x); G.hidden = !!h && G.stun <= 0; G.hideName = h ? h.name : '';
    if (h) G.checkpoint = Math.max(G.checkpoint, (h.x0 + h.x1) / 2);
    // 车灯：idle → warn（窗帘发亮）→ sweep（从窗户扫向床头）→ idle
    const B = G.beam; B.timer -= dt;
    if (B.mode === 'idle' && B.timer <= 0) { B.mode = 'warn'; B.timer = 0.9; }
    else if (B.mode === 'warn' && B.timer <= 0) { B.mode = 'sweep'; B.timer = 3.0; B.dir = Math.random() < 0.5 ? -1 : 1; B.x = B.dir < 0 ? 42 : -2; }
    else if (B.mode === 'sweep') { const k = 1 - B.timer / 3.0; B.x = B.dir < 0 ? 42 - k * 44 : -2 + k * 44; if (B.timer <= 0) { B.mode = 'idle'; B.timer = nextInterval(); } }
    // 被照到
    if (B.mode === 'sweep' && G.stun <= 0 && !G.hidden && Math.abs(B.x - G.x) < BEAM_R) {
      G.caught++; $('caught').textContent = G.caught; G.stun = 1.2; thought(); thought();
      $('flash').style.opacity = 1; setTimeout(() => $('flash').style.opacity = 0, 180);
    }
    // 终点
    if (G.x >= LEVEL.goal - 0.01) { win(); return; }
    // 提示
    if (G.stun > 0) setState('被念头抓住了', 'warn');
    else if (B.mode === 'warn') setState(G.hidden ? '躲在' + G.hideName + '，别动' : '窗帘亮了，快躲起来', G.hidden ? 'safe' : 'warn');
    else if (B.mode === 'sweep') setState(G.hidden ? '躲在' + G.hideName : '车灯扫过来了', G.hidden ? 'safe' : 'warn');
    else setState(G.hidden ? '躲在' + G.hideName : '');
    $('prog').style.width = ((G.x - LEVEL.start) / (LEVEL.goal - LEVEL.start) * 100).toFixed(1) + '%';
  }
  // ---- 表现 ----
  const B = G.beam, sweeping = B.mode === 'sweep', warn = B.mode === 'warn';
  beam.intensity = sweeping ? 14 : 0;
  beam.target.position.set(B.x, 0, 0);
  cone.position.copy(beam.position); cone.lookAt(B.x, 0, 0); cone.material.opacity = sweeping ? 0.11 : 0;
  spot.position.x = B.x; spot.material.opacity = sweeping ? 0.3 : 0;
  if (hand) { // 预警时在窗边冒头，扫的时候贴着光斑追过来
    const up = sweeping ? 1 : warn ? 0.5 : 0;
    hand.userData.up = (hand.userData.up || 0) + (up - (hand.userData.up || 0)) * Math.min(1, dt * 4);
    hand.visible = hand.userData.up > 0.02;
    hand.position.x = sweeping ? B.x - B.dir * 1.2 : 40;
    hand.position.y = -2.4 + hand.userData.up * 2.4 + Math.sin(G.t * 7) * 0.05 * hand.userData.up;
    hand.rotation.z = Math.sin(G.t * 3) * 0.08;
  }
  for (const c of LEVEL.curtain) c.material.emissive = new THREE.Color(warn ? 0x5a6ea8 : sweeping ? 0x2a3560 : 0x000000);
  for (const h of LEVEL.hides) for (const p of (h.props || [])) p.material.opacity = (G.hideName === h.name) ? 0.35 : 1;
  cat.position.set(G.x, 0, 0);
  cat.rotation.y = cat.userData.model ? (G.dir > 0 ? 1.05 : -1.05) : (G.dir > 0 ? 0.5 : -0.5); // 模型半侧身朝行进方向，脸仍看得到
  const walking = G.phase === 'play' && G.input && G.stun <= 0;
  cat.userData.body.position.y = cat.userData.baseY + (walking ? Math.abs(Math.sin(G.t * 12)) * 0.05 : 0);
  if (cat.userData.model && !window.__poseTest) { // 程序动画：放下手臂、走路摆腿摆手、尾巴晃、躲着时低头
    const ph = walking ? Math.sin(G.t * 12) : 0, idle = Math.sin(G.t * 2.2);
    const P = POSE;
    for (const side of ['L', 'R']) {
      poseBone('upper_arm' + side, P.armDown.axis, P.armDown.angle);
      poseBone('upper_arm' + side, P.armSwing.axis, P.armSwing.amp * ph, true);
    }
    poseBone('thighL', P.legL, P.legAmp * ph);
    poseBone('thighR', P.legR, -P.legAmp * ph);
    poseBone('tail1', P.tail.axis, P.tail.amp * Math.sin(G.t * (walking ? 9 : 3)));
    poseBone('head', P.headDown, (G.hidden ? 0.35 : 0) + idle * 0.03);
  }
  cat.scale.y = G.hidden ? 0.82 : 1; // 躲着时缩一点
  cat.visible = !(G.stun > 0 && Math.floor(G.stun * 10) % 2 === 0);
  camX += (G.x + (innerWidth < innerHeight ? 0.8 : 3) - camX) * Math.min(1, dt * 3);
  camera.position.set(camX, 3.2, 13.5); camera.lookAt(camX, 2.2, -2);
  if (G.phase === 'end') { // 天亮：背景、环境光、月光一起转成暖色晨光
    const k = Math.min(1, (G.endT += dt) / 2.5);
    scene.background.setRGB(0.03 + k * 0.55, 0.04 + k * 0.42, 0.07 + k * 0.3); scene.fog.color.copy(scene.background);
    hemi.intensity = 1.6 + k * 2.2; hemi.color.setRGB(0.29 + k * 0.7, 0.35 + k * 0.5, 0.56 + k * 0.1);
    moon.color.setRGB(0.49 + k * 0.51, 0.56 + k * 0.3, 0.82 - k * 0.3); moon.intensity = 1.1 + k * 2.4;
  }
}
function win() {
  G.phase = 'end'; G.endT = 0; setState('');
  const m = Math.floor(G.t / 60), s = Math.round(G.t % 60);
  $('endTime').textContent = `06:12 AM · 用时 ${m ? m + ' 分 ' : ''}${s} 秒`;
  $('endText').innerHTML = G.caught ? `今晚被念头抓住了 ${G.caught} 次。<br>没关系，天还是亮了。` : '一次都没被念头抓住。<br>今晚算是睡着了。';
  setTimeout(() => $('end').classList.remove('hide'), 2800);
}
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.05); step(dt); renderer.render(scene, camera); });
</script>
</body>
</html>
