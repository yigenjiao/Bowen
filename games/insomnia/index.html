<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>失眠 · 灰盒</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<style>
:root{--ink:#f0e9dc;--muted:rgba(240,233,220,.6);--ember:#e6480f;--night:#070a12}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
.hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;letter-spacing:.04em}
.hud b{color:var(--ink);font-weight:500}
.bar{position:fixed;top:36px;left:14px;right:14px;height:2px;background:rgba(240,233,220,.12);pointer-events:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b4a7a,#f3c27a)}
.state{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);font-family:"Noto Serif SC","Songti SC",serif;font-size:16px;letter-spacing:.18em;color:rgba(232,226,214,.88);text-shadow:0 0 14px rgba(0,0,0,.9),0 0 30px rgba(90,120,220,.35);opacity:0;transition:opacity .9s ease;pointer-events:none;white-space:nowrap}
.state.on{opacity:1}
.state.warn{color:#d6e2ff}
.state.safe{color:rgba(214,206,190,.7)}
.thought{position:fixed;pointer-events:none;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(120,150,255,.9);font-size:clamp(18px,4.5vw,30px);opacity:0;transition:opacity .25s,transform 1.4s ease-out;white-space:nowrap}
.pad{position:fixed;bottom:22px;width:84px;height:84px;border-radius:50%;background:rgba(240,233,220,.08);border:1px solid rgba(240,233,220,.2);display:grid;place-items:center;font-size:30px;color:var(--ink);touch-action:none}
.pad.on{background:rgba(240,233,220,.2)}
#padL{left:22px}#padR{left:122px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,14,.78);text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
#end{background:linear-gradient(180deg,rgba(5,7,14,0) 0%,rgba(5,7,14,.15) 40%,rgba(5,7,14,.6) 100%)}
#end .card{text-shadow:0 2px 18px rgba(0,0,0,.55)}
.card{max-width:420px}
.card .t{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.3em;color:var(--muted);margin-bottom:14px}
.card h1{font-size:34px;font-weight:700;letter-spacing:.08em;margin-bottom:14px}
.card p{color:var(--muted);line-height:1.9;font-size:14.5px}
.card .k{margin-top:14px;font-size:12px;color:rgba(240,233,220,.42);line-height:1.8}
.card button{margin-top:22px;font:inherit;font-size:15px;padding:12px 30px;border-radius:999px;border:0;background:var(--ember);color:#fff;cursor:pointer}
.flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 60%,rgba(170,195,255,.0),rgba(170,195,255,.45));opacity:0;pointer-events:none;transition:opacity .35s}
</style>
</head>
<body>
<div id="view"></div>
<div class="hud"><div><b>失眠</b> · 灰盒 v0.1</div><div>03:07 · 被念头抓住 <b id="caught">0</b> 次</div></div>
<div class="bar"><i id="prog"></i></div>
<div class="state" id="state"></div>
<div class="flash" id="flash"></div>
<div class="pad" id="padL">‹</div><div class="pad" id="padR">›</div>

<div class="overlay" id="intro"><div class="card">
  <div class="t">03:07 AM</div>
  <h1>失眠</h1>
  <p>你又醒了。房间大得不像话。<br>走到窗帘那边，等天亮。</p>
  <p class="k">← → 或屏幕左下角按钮移动<br>窗帘一亮，就有东西要来了。躲到东西底下</p>
  <button id="go">开始</button>
</div></div>
<div class="overlay hide" id="end"><div class="card">
  <div class="t" id="endTime"></div>
  <h1>天亮了</h1>
  <p id="endText"></p>
  <button id="again">再来一次</button>
</div></div>

<script type="module">
import * as THREE from './vendor/three.module.min.js'; // 内置 three.js r169，不依赖 CDN
import { GLTFLoader } from './vendor/GLTFLoader.js';

/* ================= 关卡数据（单位：香蕉猫约 1 高） ================= */
const LEVEL = {
  start: 1, goal: 41.5, length: 44,
  // 躲藏点：x 范围内即视为躲好；mesh 由 buildRoom 生成
  hides: [
    { name: '床底下', x0: 5.5, x1: 16.5 },
    { name: '拖鞋里', x0: 20.6, x1: 22.4 },
    { name: '书后面', x0: 26.4, x1: 28.6 },
    { name: '衣服堆里', x0: 32.4, x1: 35.6 },
  ],
  thoughts: ['明天还要早起', '是不是白干了', '那句话是不是说错了', '还有三件事没做完', '再不睡就来不及了', '他们会怎么看我', '为什么还没睡着'],
};
const SPEED = 2.6;

/* ================= 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45; // 整体提亮，暗部也要看得清东西
document.getElementById('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1526);
scene.fog = new THREE.Fog(0x0d1526, 14, 52); // 带一点蓝的薄雾，远处的东西退进雾里，有空间感
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

const hemi = new THREE.HemisphereLight(0x6a80c0, 0x1c1610, 2.3); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fa3e8, 1.8); // 窗外的冷月光
moon.position.set(46, 18, 10); moon.target.position.set(20, 0, -3); moon.castShadow = true;
moon.shadow.mapSize.set(1024, 512); Object.assign(moon.shadow.camera, { left: -30, right: 30, top: 16, bottom: -6, far: 80 });
scene.add(moon); scene.add(moon.target);
const night = new THREE.PointLight(0xffb36b, 22, 10, 2); // 按距离衰减，只暖床头一小块，不在镜头前的地板上反出亮斑 // 床头小夜灯
night.position.set(2.2, 3.2, -1.5); scene.add(night); // 点光源阴影要渲染 6 次，手机上太贵，不开

const gray = (c = 0x5c6170, r = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };

/* ---- 木地板贴图（程序生成，不用外部图片） ---- */
function plankTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  const rows = 8, h = 512 / rows;
  for (let r = 0; r < rows; r++) {
    let x = -((r * 173) % 400);
    while (x < 512) {
      const w = 260 + ((r * 97 + x) % 180), v = 70 + ((r * 31 + Math.abs(x)) % 30);
      g.fillStyle = `rgb(${v + 18},${v},${v - 14})`; g.fillRect(x, r * h, w, h);
      for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(30,20,12,${0.05 + (k % 3) * 0.03})`; g.beginPath(); const yy = r * h + 4 + k * (h - 8) / 14; g.moveTo(x, yy); g.bezierCurveTo(x + w * 0.3, yy + 2, x + w * 0.6, yy - 2, x + w, yy + 1); g.stroke(); }
      g.fillStyle = 'rgba(15,10,6,.85)'; g.fillRect(x, r * h, 2, h); x += w;
    }
    g.fillStyle = 'rgba(12,8,5,.9)'; g.fillRect(0, r * h, 512, 2);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 4); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
/* ---- 体积光：用叠加混合的半透明面片假装光柱，中间亮、两边和末端化开，带一点浮尘闪动 ---- */
const shaftMats = [];
function shaftMaterial(color, strength) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
    uniforms: { uTime: { value: 0 }, uOpacity: { value: strength }, uColor: { value: new THREE.Color(color) } },
    vertexShader: 'varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: `uniform float uTime; uniform float uOpacity; uniform vec3 uColor; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){
        float across = sin(vUv.x * 3.14159);                 // 横向：中间亮，两边化开
        float along = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.55, 1.0, vUv.y)); // 纵向：两端都淡出
        float face = pow(abs(dot(vN, vV)), 0.6);             // 侧着看时变薄，不露出面片的硬边
        float dust = 0.85 + 0.15 * sin(vUv.y * 40.0 + uTime * 0.7) * sin(vUv.x * 23.0 - uTime * 0.4);
        gl_FragColor = vec4(uColor, uOpacity * across * across * along * face * dust);
      }`,
  });
  shaftMats.push(m); return m;
}
/* ---- 窗户：后墙上的高窗 + 百叶窗缝里漏下来的几道月光 ---- */
function addWindowLight() {
  for (const wx of [-1.5, 23]) {
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 7), new THREE.MeshBasicMaterial({ color: 0x5f78b8, fog: false }));
    pane.position.set(wx, 7.5, -8.7); scene.add(pane);
    for (let i = 0; i < 4; i++) box(3.4, 0.25, 0.3, gray(0x1a2034), wx, 4.5 + i * 2, -8.6); // 窗棂
    for (let i = 0; i < 3; i++) { // 三道斜下来的光柱，落在地板上
      const len = 15, sh = new THREE.Mesh(new THREE.PlaneGeometry(1.1 + i * 0.25, len), shaftMaterial(0x7f9cff, 0.5 - i * 0.1));
      const top = new THREE.Vector3(wx - 0.9 + i * 0.9, 9, -8.5), bot = new THREE.Vector3(wx + 3.5 + i * 1.4, 0, 1.5);
      sh.position.copy(top).add(bot).multiplyScalar(0.5);
      const yA = top.clone().sub(bot).normalize(), zA = new THREE.Vector3(0, 0, 1).addScaledVector(yA, -yA.z).normalize(), xA = new THREE.Vector3().crossVectors(yA, zA);
      sh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, yA, zA)); // 面片沿光线方向拉长，正面朝镜头
      sh.scale.y = top.distanceTo(bot) / len; scene.add(sh);
    }
    const pool = new THREE.Mesh(new THREE.PlaneGeometry(9, 5), new THREE.MeshBasicMaterial({ map: radialTexture(), color: 0x6f8ce0, transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
    pool.rotation.x = -Math.PI / 2; pool.position.set(wx + 5, 0.015, -0.5); scene.add(pool); // 地板上被照亮的一片
  }
  // 浮尘：光里慢慢飘的小颗粒
  const n = 500, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const wx = i % 2 ? -1.5 : 23, t = Math.random(); pos[i * 3] = wx + t * 5 - 1 + (Math.random() - 0.5) * 3; pos[i * 3 + 1] = 9 - t * 9 + (Math.random() - 0.5); pos[i * 3 + 2] = -8.5 + t * 10 + (Math.random() - 0.5) * 2; } // 只在光柱里飘
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  dust = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.035, color: 0xaebfff, transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(dust);
}
let dust = null;
let _radial = null;
function radialTexture() {
  if (_radial) return _radial;
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.45, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); _radial = new THREE.CanvasTexture(c); return _radial;
}

/* ---- 地板光泽：用一个很小的假环境（暗蓝底 + 几块窗光）生成反射贴图，便宜，手机也跑得动 ---- */
function floorEnv() {
  const es = new THREE.Scene(); es.background = new THREE.Color(0x0a1020);
  const lit = (c, w, h, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  lit(0x6f8fe0, 3, 6, -4, 5, -8); lit(0x6f8fe0, 3, 6, 6, 5, -8); lit(0x4a5f9a, 20, 4, 0, 9, 0); lit(0xffb070, 1.2, 1.2, -6, 2, -3);
  const pm = new THREE.PMREMGenerator(renderer); const t = pm.fromScene(es, 0.02).texture; pm.dispose(); return t;
}

function buildRoom() {
  // 地板与墙
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 30), new THREE.MeshStandardMaterial({ map: plankTexture(), color: 0xb09080, roughness: 0.32, metalness: 0.0, envMap: floorEnv(), envMapIntensity: 1.6 })); // 打过蜡的木地板，能反出光斑
  floor.rotation.x = -Math.PI / 2; floor.position.set(22, 0, -4); floor.receiveShadow = true; scene.add(floor);
  box(80, 24, 0.5, gray(0x2c3653), 22, 12, -9);
  addWindowLight();
  // 床（巨大）：床板离地 1.7，香蕉猫能从下面走过
  const bedM = gray(0x4a5168);
  box(12, 0.6, 7, bedM, 11, 2.0, -3.5);                       // 床板
  for (const [x, z] of [[5.2, -1.0], [16.8, -1.0], [5.2, -6.7], [16.8, -6.7]]) box(0.5, 1.7, 0.5, bedM, x, 0.85, z);
  box(12, 1.6, 7, gray(0x6b7390), 11, 3.1, -3.5);             // 床垫
  const blanket = gray(0x7d6fa0, 1);                            // 被子起伏
  for (let i = 0; i < 6; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(1.6 + (i % 2) * 0.6, 16, 12), blanket); s.scale.set(1.3, 0.55, 2.2); s.position.set(6.5 + i * 1.8, 4.1, -3.5); s.castShadow = true; scene.add(s); }
  box(0.6, 7, 6.4, bedM, 4.7, 3.5, -4.0);                      // 床头板（前沿退到香蕉猫走的线后面，避免穿模）
  // 床头柜 + 小夜灯
  LEVEL.nightstand = box(3, 3.2, 3, gray(0x51473d), 2, 1.6, -5.5);
  box(0.5, 0.9, 0.5, gray(0xf3c27a), 2.2, 3.65, -5.2);
  // 拖鞋（可躲）
  const slip = new THREE.MeshStandardMaterial({ color: 0xc98fa8, roughness: 1, side: THREE.DoubleSide }); // 绒面拖鞋
  const sole = box(3.8, 0.2, 2.1, new THREE.MeshStandardMaterial({ color: 0x8a5a6e, roughness: 0.9 }), 21.3, 0.1, -0.1);
  // 鞋头朝 +x：侧面对着镜头，是一整块拱起的绒面；鞋口（-x 一侧）有一圈浅色绒边
  const S = [1, 1.15, 1.05];
  const capGeo = new THREE.CylinderGeometry(1.0, 1.0, 1.8, 24, 1, true, Math.PI, Math.PI); capGeo.rotateZ(-Math.PI / 2); capGeo.scale(...S);
  const cap = new THREE.Mesh(capGeo, slip); cap.position.set(21.3, 0.2, -0.1);
  const toeGeo = new THREE.SphereGeometry(1.0, 24, 12, Math.PI / 2, Math.PI, 0, Math.PI / 2); toeGeo.scale(...S);
  const toe = new THREE.Mesh(toeGeo, slip); toe.position.set(22.2, 0.2, -0.1);
  const rimGeo = new THREE.TorusGeometry(1.0, 0.1, 8, 24, Math.PI); rimGeo.rotateY(Math.PI / 2); rimGeo.scale(...S);
  const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({ color: 0xf2d6e0, roughness: 1 })); rim.position.set(20.4, 0.2, -0.1);
  for (const o of [cap, toe, rim]) { o.castShadow = o.receiveShadow = true; scene.add(o); }
  LEVEL.hides[1].props = [cap, toe, rim, sole];
  // 书堆（可躲：书搭成一个洞）
  const bk = [0x6d4f3a, 0x3f5a6b, 0x7a3f3f, 0x55613f];
  LEVEL.hides[2].props = [box(0.5, 1.4, 1.8, gray(bk[0]), 26.6, 0.7, 0), box(0.5, 1.4, 1.8, gray(bk[1]), 28.4, 0.7, 0)];
  for (let i = 0; i < 4; i++) LEVEL.hides[2].props.push(box(2.6 - i * 0.15, 0.3, 2 - i * 0.1, gray(bk[i]), 27.5 + (i % 2) * 0.1, 1.55 + i * 0.3, 0));
  // 衣服堆（可躲）
  const cl = [0x5b6b8a, 0x8a5b5b, 0x6b6b6b];
  LEVEL.hides[3].props = [];
  for (let i = 0; i < 5; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(1.2, 14, 10), gray(cl[i % 3], 1)); s.scale.set(1.2, 0.85, 1); s.position.set(32.8 + i * 0.7, 1.15 + (i % 2) * 0.3, -0.1); s.castShadow = true; scene.add(s); LEVEL.hides[3].props.push(s); }
  // 杂物（不能躲，纯氛围）
  box(1.2, 0.08, 2.2, gray(0x111318), 24.5, 0.04, 0.6).material.emissive = new THREE.Color(0x1d2a55); // 掉在地上的手机
  LEVEL.dresser = box(3, 9, 2, gray(0x40475a), 30, 4.5, -7);     // 衣柜
  // 窗与窗帘（终点）
  box(0.4, 10, 6, gray(0x2b3248), 43.5, 7, -5);
  LEVEL.curtain = [box(1.2, 14, 1, gray(0x5a4f7a, 1), 42, 7, -1.5), box(1.2, 14, 1, gray(0x5a4f7a, 1), 42, 7, -6.5)];
  for (const c of LEVEL.curtain) c.material = c.material.clone();
  // 躲藏点道具做成可淡出
  for (const h of LEVEL.hides) for (const p of (h.props || [])) { p.material = p.material.clone(); p.material.transparent = true; }
}
buildRoom();

/* ================= 香蕉猫（占位） =================
 * 正式模型在 models/banana-cat.glb，加载成功后替换掉这个胶囊；加载失败才用它。 */
function makeCat() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.55, 6, 14), new THREE.MeshStandardMaterial({ color: 0xf2c94c, roughness: 0.6 }));
  body.position.y = 0.6; body.castShadow = true; g.add(body);
  const stem = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0x3a2a18 }));
  stem.position.set(0, 1.2, 0); g.add(stem);
  for (const s of [-1, 1]) { const ear = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.22, 8), new THREE.MeshStandardMaterial({ color: 0xf29bb5 })); ear.position.set(0.18 * s, 1.0, 0.05); ear.rotation.z = -0.35 * s; g.add(ear); }
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x111111 });
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), eyeM); e.position.set(0.11 * s, 0.72, 0.3); g.add(e); }
  g.userData.body = body;
  return g;
}
const cat = makeCat(); scene.add(cat);
cat.userData.baseY = 0.6;

/* ---- 正式模型：models/banana-cat.glb。加载失败就继续用占位胶囊 ---- */
// 骨骼动画参数。轴是骨骼自己的局部轴，按模型实测得出（three.js 会把骨骼名里的点去掉）
const V = (x, y, z) => new THREE.Vector3(x, y, z).normalize();
const POSE = {
  armDown: { axis: V(-1, 0, 0), angle: 1.15 },              // 两臂同轴：把 T 字形张开的手臂放下来
  armSwing: { axis: V(0, 0, 1), amp: 0.4 },                 // 左臂 +z 往后、右臂 +z 往前，同号即一前一后
  legL: V(1, 0, -1), legR: V(1, 0, 1), legAmp: 0.5,        // 大腿往前摆的轴（左右镜像）
  tail: { axis: V(0, 0, 1), amp: 0.35 },                    // 尾巴左右晃
  headDown: V(0, 0, -1),                                    // 低头
};
const rig = { bones: {}, rest: {} };
const _q = new THREE.Quaternion();
function poseBone(name, axis, angle, keep) { // keep=true 时在当前姿势上继续叠加
  const b = rig.bones[name]; if (!b) return;
  if (!keep) b.quaternion.copy(rig.rest[name]);

new GLTFLoader().loadAsync('models/banana-cat.glb').then(g => {
  const m = g.scene, box = new THREE.Box3().setFromObject(m), h = box.max.y - box.min.y;
  const wrap = new THREE.Group(); wrap.add(m);
  const k = 1.2 / (h || 1); m.scale.setScalar(k);
  m.position.set(-(box.min.x + box.max.x) / 2 * k, -box.min.y * k, -(box.min.z + box.max.z) / 2 * k);
  m.traverse(o => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    if (o.isBone) { rig.bones[o.name] = o; rig.rest[o.name] = o.quaternion.clone(); }

  for (const c of [...cat.children]) if (!c.isLight) cat.remove(c);
  cat.add(wrap); cat.userData.body = wrap; cat.userData.baseY = 0; cat.userData.model = m;
  cat.userData.halfDepth = (box.max.z - box.min.z) / 2 * k; // 趴下时用来把身体抬到地面上

}).catch(e => console.warn('香蕉猫模型加载失败，继续用占位胶囊', e));

/* ---- 本地测试模型：放在 models/local/（.gitignore 忽略，不进公开仓库）。找不到就继续用方块 ---- */
function loadProp(name, height, place, replace) {
  return new GLTFLoader().loadAsync(name.endsWith('.glb') ? name : 'models/local/' + name + '.glb').then(g => {
    const m = g.scene, b = new THREE.Box3().setFromObject(m), size = b.getSize(new THREE.Vector3());
    const k = height / (size.y || 1); m.scale.multiplyScalar(k);
    const wrap = new THREE.Group(); wrap.add(m);
    m.position.set(-(b.min.x + b.max.x) / 2 * k, -b.min.y * k, -(b.min.z + b.max.z) / 2 * k); // 底面中心对齐原点
    m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
    place(wrap); scene.add(wrap);
    if (replace) replace.visible = false;
    return wrap;
  }).catch(() => null);
}
loadProp('cabinet', 6.5, w => { w.position.set(30, 0, -6.4); w.rotation.y = Math.PI; }, LEVEL.dresser);
loadProp('cabinet', 3.2, w => { w.position.set(2, 0, -5.5); w.rotation.y = Math.PI; }, LEVEL.nightstand); // 床头柜也换成柜子，高度不变，闹钟和小夜灯还在上面
loadProp('clock', 1.3, w => { w.position.set(1.2, 3.2, -5.0); w.rotation.y = Math.PI + 0.35; });
/* ---- 影子手：models/shadow-hand.glb + 透明影子 shader ----
 * 中心浓、边缘化开（看正面最实，侧面变薄），表面像烟一样慢慢蠕动，贴近地面的部分淡出。
 * 不投射真实阴影（影子本身不该再有影子）。uOpacity 控制整体出现/消失。 */
const shadowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 }, uColor: { value: new THREE.Color(0x07050d) }, uRim: { value: new THREE.Color(0x3a3f6a) } },
  vertexShader: `
    uniform float uTime;
    varying vec3 vN; varying vec3 vV; varying float vY; varying float vWob;
    void main() {
      vec3 p = position;
      float w = sin(p.x * 9.0 + uTime * 2.3) * sin(p.y * 7.0 - uTime * 1.7) * sin(p.z * 8.0 + uTime * 1.1);
      p += normal * w * 0.012;                       // 烟一样的表面蠕动（模型空间单位，模型约 1 长）
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vec4 mv = viewMatrix * wp;
      vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); vY = wp.y; vWob = w;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime; uniform float uOpacity; uniform vec3 uColor; uniform vec3 uRim;
    varying vec3 vN; varying vec3 vV; varying float vY; varying float vWob;
    void main() {
      float ndv = abs(dot(normalize(vN), normalize(vV)));
      float core = smoothstep(0.05, 0.75, ndv);      // 正对镜头处浓，轮廓边缘化开
      float ground = smoothstep(0.0, 0.6, vY);       // 碰到地板的地方淡出，像从地里渗出来
      float flicker = 0.85 + 0.15 * sin(uTime * 13.0 + vWob * 6.0);
      float a = uOpacity * mix(0.15, 0.92, core) * ground * flicker;
      vec3 col = mix(uRim, uColor, core);            // 边缘一丝冷光，中间接近纯黑
      gl_FragColor = vec4(col, a);
    }`,
});
let hand = null; // 影子手：预警时在窗边冒头，车灯扫的时候跟着光斑伸过去
loadProp('models/shadow-hand.glb', 2.7, w => {
  w.position.set(40, -3, -1.6); w.visible = false;
  w.traverse(o => { if (o.isMesh) { o.material = shadowMat; o.castShadow = false; o.receiveShadow = false; o.renderOrder = 2; } });
}).then(w => { hand = w; window.__hand = w; });

// 脚下的接触阴影：一块柔边的暗斑，跟着香蕉猫走，让它踩在地上而不是飘着
const blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: radialTexture(), color: 0x000000, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.NormalBlending }));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.012; blob.renderOrder = 1; scene.add(blob);
let lie = 0; // 0 站着 → 1 趴在床底下
const catGlow = new THREE.PointLight(0xfff0c8, 0.6, 2.4, 2); catGlow.position.set(0, 1.6, 0.9); cat.add(catGlow); // 保证玩家看得见自己

/* ================= 车灯 ================= */
const beam = new THREE.SpotLight(0xcfe0ff, 0, 70, 0.3, 0.45, 0);
beam.castShadow = true; beam.shadow.mapSize.set(512, 512);
beam.position.set(44, 9, -3); scene.add(beam); scene.add(beam.target);
const coneGeo = new THREE.ConeGeometry(4.2, 14, 32, 1, true); coneGeo.translate(0, -7, 0); coneGeo.rotateX(-Math.PI / 2);
// 光锥：体积光 shader，中心亮、边缘和远端化开，不再是一个半透明白模
const coneMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
  uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 }, uColor: { value: new THREE.Color(0xc6d8ff) } },
  vertexShader: 'varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
  fragmentShader: `uniform float uTime; uniform float uOpacity; uniform vec3 uColor; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      float core = pow(abs(dot(normalize(vN), normalize(vV))), 2.2);  // 光锥中轴最亮，轮廓处消失
      float fall = pow(vUv.y, 1.4);                                  // 离车灯越远越淡（uv.y=1 在灯口）
      float dust = 0.88 + 0.12 * sin(vUv.y * 60.0 - uTime * 3.0) * sin(vUv.x * 50.0 + uTime);

const cone = new THREE.Mesh(coneGeo, coneMat);
scene.add(cone);
const spot = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ map: radialTexture(), color: 0xdfe9ff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })); // 边缘柔和的光斑
spot.rotation.x = -Math.PI / 2; spot.position.y = 0.02; scene.add(spot);
const BEAM_R = 2.6; // 地面上被照到的半径

/* ================= 状态 ================= */
const G = {
  phase: 'intro', x: LEVEL.start, dir: 1, input: 0, checkpoint: LEVEL.start, caught: 0, t: 0, hidden: false, hideName: '',
  beam: { mode: 'idle', timer: 3.5, x: 0 }, stun: 0,
};
window.__game = G;

window.__G = G; // 方便调试和自动测试
function hideAt(x) { return LEVEL.hides.find(h => x >= h.x0 && x <= h.x1); }
function nextInterval() { return 2.0 + Math.random() * 1.2; }

/* ================= 输入 ================= */
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key); if (G.phase === 'intro' && (e.key === 'Enter' || e.key === ' ')) start(); });
addEventListener('keyup', e => keys.delete(e.key));
for (const [id, d] of [['padL', -1], ['padR', 1]]) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('on'); el.dataset.d = d; };
  const off = e => { e.preventDefault(); el.classList.remove('on'); delete el.dataset.d; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
function readInput() {
  let v = 0;
  if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) v -= 1;
  if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) v += 1;
  for (const id of ['padL', 'padR']) { const d = document.getElementById(id).dataset.d; if (d) v += +d; }

/* ================= UI ================= */
const $ = id => document.getElementById(id);
const MSG = {
  'warn': ['窗帘后面，有光在转弯。', '墙上的影子，慢慢变长了。', '床底下，有指甲刮过地板。', '有什么东西，醒了。'],
  'warn-hide': ['别动。', '屏住呼吸。', '它还没看见你。'],
  'sweep': ['它在找你。', '影子伸出了手。', '光扫过来了，躲起来。'],
  'sweep-hide': ['它的手指，从你身边经过。', '再等一下。', '别出声。'],
  'stun': ['一个念头抓住了你。', '你又想多了。'],
};
function setState(text, cls) { const s = $('state'); s.textContent = text; s.className = 'state' + (text ? ' on ' + (cls || '') : ''); }
function thought() {
  const el = document.createElement('div'); el.className = 'thought';
  el.textContent = LEVEL.thoughts[Math.floor(Math.random() * LEVEL.thoughts.length)];
  el.style.left = (20 + Math.random() * 45) + '%'; el.style.top = (22 + Math.random() * 30) + '%';
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = 1; el.style.transform = 'translateY(-26px) scale(1.06)'; });
  setTimeout(() => { el.style.opacity = 0; }, 1300); setTimeout(() => el.remove(), 1800);
}
function start() {
  Object.assign(G, { phase: 'play', x: LEVEL.start, checkpoint: LEVEL.start, caught: 0, t: 0, stun: 0, beam: { mode: 'idle', timer: 3.2, x: 0 } });
  $('caught').textContent = 0; $('intro').classList.add('hide'); $('end').classList.add('hide');
}
$('go').onclick = start; $('again').onclick = start;

/* ================= 循环 ================= */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 62 : 42; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let camX = LEVEL.start;
function step(dt) {
  if (G.phase === 'play') {
    G.t += dt;
    // 移动
    if (G.stun > 0) { G.stun -= dt; if (G.stun <= 0) { G.x = G.checkpoint; } }
    else {
      const v = readInput(); G.input = v;
      if (v) G.dir = v;
      G.x = Math.min(LEVEL.goal, Math.max(0.5, G.x + v * SPEED * dt));
    }
    const h = hideAt(G.x); G.hidden = !!h && G.stun <= 0; G.hideName = h ? h.name : '';
    if (h) G.checkpoint = Math.max(G.checkpoint, (h.x0 + h.x1) / 2);
    // 车灯：idle → warn（窗帘发亮）→ sweep（从窗户扫向床头）→ idle
    const B = G.beam; B.timer -= dt;
    if (B.mode === 'idle' && B.timer <= 0) { B.mode = 'warn'; B.timer = 0.9; }
    else if (B.mode === 'warn' && B.timer <= 0) { B.mode = 'sweep'; B.timer = 3.0; B.dir = Math.random() < 0.5 ? -1 : 1; B.x = B.dir < 0 ? 42 : -2; }
    else if (B.mode === 'sweep') { const k = 1 - B.timer / 3.0; B.x = B.dir < 0 ? 42 - k * 44 : -2 + k * 44; if (B.timer <= 0) { B.mode = 'idle'; B.timer = nextInterval(); } }
    // 被照到
    if (B.mode === 'sweep' && G.stun <= 0 && !G.hidden && Math.abs(B.x - G.x) < BEAM_R) {
      G.caught++; $('caught').textContent = G.caught; G.stun = 1.2; thought(); thought();
      $('flash').style.opacity = 1; setTimeout(() => $('flash').style.opacity = 0, 180);
    }
    // 终点
    if (G.x >= LEVEL.goal - 0.01) { win(); return; }
    // 提示
    // 提示文字：不报“车来了”，只写感觉。每次危险阶段开始时随机挑一句，阶段内不换
    const key = G.stun > 0 ? 'stun' : B.mode + (G.hidden ? '-hide' : '');
    if (key !== G.msgKey) { G.msgKey = key; const pool = MSG[key]; G.msg = pool ? pool[Math.floor(Math.random() * pool.length)] : ''; }
    setState(G.msg, G.hidden || B.mode === 'idle' ? 'safe' : 'warn');
    $('prog').style.width = ((G.x - LEVEL.start) / (LEVEL.goal - LEVEL.start) * 100).toFixed(1) + '%';
  }
  // ---- 表现 ----
  const B = G.beam, sweeping = B.mode === 'sweep', warn = B.mode === 'warn';
  beam.intensity = sweeping ? 14 : 0;
  beam.target.position.set(B.x, 0, 0);
  cone.position.copy(beam.position); cone.lookAt(B.x, 0, 0); coneMat.uniforms.uOpacity.value = sweeping ? 0.55 : 0; coneMat.uniforms.uTime.value = G.t;
  for (const m of shaftMats) m.uniforms.uTime.value = G.t;
  if (dust) { dust.rotation.y = 0; dust.position.y = Math.sin(G.t * 0.3) * 0.15; dust.position.x = Math.sin(G.t * 0.2) * 0.3; }
  spot.position.x = B.x; spot.material.opacity = sweeping ? 0.55 : 0;
  if (hand) { // 预警时在窗边冒头，扫的时候贴着光斑追过来
    const up = sweeping ? 1 : warn ? 0.5 : 0;
    hand.userData.up = (hand.userData.up || 0) + (up - (hand.userData.up || 0)) * Math.min(1, dt * 4);
    hand.visible = hand.userData.up > 0.02;
    const dir = sweeping ? B.dir : -1;
    hand.position.x = sweeping ? B.x - dir * 2.2 : 40;           // 手腕落后光斑一截，指尖伸向光斑
    hand.position.y = -2.7 + hand.userData.up * 2.7 + Math.sin(G.t * 7) * 0.05 * hand.userData.up;
    hand.rotation.y = dir * Math.PI / 2 + Math.sin(G.t * 2.1) * 0.12; // 模型指尖朝 +Z，转到行进方向
    hand.rotation.z = Math.sin(G.t * 3) * 0.06;
    shadowMat.uniforms.uTime.value = G.t; shadowMat.uniforms.uOpacity.value = Math.min(1, hand.userData.up);
  }
  for (const c of LEVEL.curtain) c.material.emissive = new THREE.Color(warn ? 0x5a6ea8 : sweeping ? 0x2a3560 : 0x000000);
  for (const h of LEVEL.hides) for (const p of (h.props || [])) p.material.opacity = (G.hideName === h.name) ? 0.55 : 1; // 躲进去时半透明，但还看得出是什么
  cat.position.set(G.x, 0, 0);
  cat.rotation.y = cat.userData.model ? (G.dir > 0 ? 1.05 : -1.05) * (1 - lie) : (G.dir > 0 ? 0.5 : -0.5); // 模型半侧身朝行进方向，脸仍看得到
  const walking = G.phase === 'play' && G.input && G.stun <= 0;
  cat.userData.body.position.y = cat.userData.baseY + (walking ? Math.abs(Math.sin(G.t * 12)) * 0.05 : 0);
  if (cat.userData.model && !window.__poseTest) { // 程序动画：放下手臂、走路摆腿摆手、尾巴晃、躲着时低头
    const ph = walking ? Math.sin(G.t * 12) : 0, idle = Math.sin(G.t * 2.2);
    const P = POSE;
    for (const side of ['L', 'R']) {
      poseBone('upper_arm' + side, P.armDown.axis, P.armDown.angle);
      poseBone('upper_arm' + side, P.armSwing.axis, P.armSwing.amp * ph, true);
    }
    poseBone('thighL', P.legL, P.legAmp * ph);
    poseBone('thighR', P.legR, -P.legAmp * ph);
    poseBone('tail1', P.tail.axis, P.tail.amp * Math.sin(G.t * (walking ? 9 : 3)));
    poseBone('head', P.headDown, (G.hidden && lie < 0.1 ? 0.35 : 0) - lie * 0.85 + idle * 0.03); // 趴下时抬头往前看
  }
  // 床底下：趴在地上；其他躲藏点：缩一点
  lie += ((G.hidden && G.hideName === '床底下' ? 1 : 0) - lie) * Math.min(1, dt * 7);
  if (cat.userData.model) {
    const a = lie * 1.2, wb = cat.userData.body;
    wb.rotation.x = a; wb.position.y += (cat.userData.halfDepth || 0.3) * Math.sin(a) * 0.4;
  }
  cat.scale.y = G.hidden && lie < 0.5 ? 0.82 : 1;
  blob.position.x = G.x + Math.sin(cat.rotation.y) * lie * 0.55; blob.position.z = Math.cos(cat.rotation.y) * lie * 0.45;
  blob.scale.set(1.15 + lie * 0.9, 0.75 + lie * 0.35, 1); blob.rotation.z = 0;
  blob.material.opacity = cat.visible === false ? 0 : 0.7;
  // 跟身灯不投影，一直亮着会让香蕉猫在床底、阴影里也发亮。躲起来时熄掉，开阔处留一点轮廓光
  catGlow.intensity += ((G.hidden ? 0 : 1.2) - catGlow.intensity) * Math.min(1, dt * 5);
  cat.visible = !(G.stun > 0 && Math.floor(G.stun * 10) % 2 === 0);
  camX += (G.x + (innerWidth < innerHeight ? 0.4 : 2) - camX) * Math.min(1, dt * 3);
  camera.position.set(camX, 2.1, 8.4); camera.lookAt(camX, 1.8, -3); // 低机位、贴近香蕉猫，房间显得巨大
  if (G.phase === 'end') { // 天亮：背景、环境光、月光一起转成暖色晨光
    const k = Math.min(1, (G.endT += dt) / 2.5);
    scene.background.setRGB(0.05 + k * 0.53, 0.08 + k * 0.38, 0.15 + k * 0.22); scene.fog.color.copy(scene.background);
    hemi.intensity = 2.3 + k * 1.5; hemi.color.setRGB(0.29 + k * 0.7, 0.35 + k * 0.5, 0.56 + k * 0.1);
    moon.color.setRGB(0.49 + k * 0.51, 0.56 + k * 0.3, 0.82 - k * 0.3); moon.intensity = 1.8 + k * 1.7;
  }
}
function win() {
  G.phase = 'end'; G.endT = 0; setState('');
  const m = Math.floor(G.t / 60), s = Math.round(G.t % 60);
  $('endTime').textContent = `06:12 AM · 用时 ${m ? m + ' 分 ' : ''}${s} 秒`;
  $('endText').innerHTML = G.caught ? `今晚被念头抓住了 ${G.caught} 次。<br>没关系，天还是亮了。` : '一次都没被念头抓住。<br>今晚算是睡着了。';
  setTimeout(() => $('end').classList.remove('hide'), 2800);
}
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.05); step(dt); renderer.render(scene, camera); });
</script>
